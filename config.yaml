# Configuration for the R&D funding call monitoring tool

# Keywords/search terms used for matching and filtering.
# Case doesn't matter. A single match (in title or description) is enough.
# Note: keep these in German — the source databases (EU portal German results,
# foerderdatenbank.de) describe programmes in German, so German search terms
# match far more reliably than English ones.
keywords:
  - "Landwirtschaft"
  - "Infrastruktur"
  - "5G"
  - "Satellit"
  - "6G"
  - "Mobilität"
  - "KI"
  - "Digitaler Zwilling"
  - "Energieerzeugung"
  - "Verteidigung"
  - "Zivile Sicherheit" 
  

# Minimum funding rate in percent. Calls with a detected rate below this value
# are dropped. Entries where no rate could be detected are kept and marked as
# "unknown" in the output (please check manually).
min_funding_rate_percent: 0

# Only keep calls whose deadline is still in the future (already-expired ones are dropped).
open_deadlines_only: true

# Deadlines closer than X days are marked as "urgent" in the output.
deadline_warning_days: 14

eu_portal:
  enabled: false
  page_size: 100
  max_pages: 3

manual_import:
  enabled: true
  # Drop saved search-result pages here (e.g. from foerderdatenbank.de:
  # search in your browser -> save page completely as .html -> put it in this folder).
  input_dir: "input"

gov_bekanntmachungen:
  # German government funding-call announcement pages. Each source below was
  # individually checked against its own robots.txt before being added here.
  #
  # Every source has two kinds of setting, and they answer two different
  # questions — this is the part that isn't obvious, so read this before adding
  # a new source:
  #
  #   1. WHERE do we start looking? This is `listing_url` (discovery: listing)
  #      or `search_site` (discovery: brave) — a single fixed page/domain.
  #
  #   2. Of everything we find FROM there, which bits are actually a real
  #      announcement? This is `link_path_marker`. A listing page has dozens of
  #      <a href> links on it — nav menu, "Kontakt", "Impressum", footer links,
  #      unrelated content — and only some of them lead to an actual funding
  #      announcement. A Brave search similarly returns many URLs on the target
  #      site, most of them irrelevant. `link_path_marker` is a substring: any
  #      discovered link whose URL contains it is treated as an announcement to
  #      fetch; everything else is ignored.
  #
  #   You can't just fold link_path_marker into listing_url, because they don't
  #   describe the same thing: listing_url is the one page we visit up front,
  #   while link_path_marker is a filter applied afterwards to the many
  #   *different* URLs that page (or the Brave search) hands back to us.
  #
  # Concrete example (BLE below): listing_url is
  # ".../Bekanntmachungen/Bekanntmachungen_node.html" — one page. That page's
  # links include things like ".../BLE/Kontakt/kontakt_node.html" (ignore) and
  # ".../Foerderungen-Auftraege/Bundesprogramm_Umbau_Tierhaltung/.../investiv_node.html"
  # (a real funding programme — keep). link_path_marker "/Foerderungen-Auftraege/"
  # is the piece of that second URL that separates it from the first.
  #
  # discovery modes:
  #  - listing -> the site's own announcement listing page isn't disallowed by
  #    robots.txt, so we crawl it directly to find announcement links.
  #  - brave -> the site's listing/search page IS disallowed (like
  #    bmftr.bund.de's /SiteGlobals/ path), but individual announcement pages
  #    are allowed, so we use the Brave Search API (site: query) to find them
  #    instead of ever crawling the disallowed page ourselves.
  #
  # Setup for "brave" sources (~2 min): https://api-dashboard.search.brave.com/
  # -> sign up, add a payment method (required, but usage-based: ~$5 in free
  # credits/month covers our tiny volume) -> create an API key -> paste into
  # brave_api_key below. DON'T put the real key here — this file is committed.
  # Put it in config.local.yaml instead (gitignored, deep-merged on top of this
  # file at load time). Leave brave_api_key empty to skip all "brave" sources
  # (any "listing" sources still work without it). Any number of keys can be
  # given as a list; each request then picks one at random.
  enabled: true
  brave_api_key: ""
  sources:
    - name: "BMFTR/BMBF Bekanntmachungen"
      discovery: brave
      # search_site: which domain we restrict the Brave search to — we never
      # crawl bmftr.bund.de's own (disallowed) search page ourselves.
      search_site: "bmftr.bund.de"
      # Of the URLs Brave returns on that domain, only ones like
      # ".../SharedDocs/Bekanntmachungen/DE/2026/07/2026-07-08-foo.html" are
      # actual announcements — this substring is what picks those out.
      link_path_marker: "/SharedDocs/Bekanntmachungen/"
      # discovery_terms are searched IN ADDITION to your keywords above, because
      # neither set alone finds everything: generic terms enumerate broadly (~65
      # announcements) but rank niche calls out of reach, while your keywords
      # surface exactly those niche calls. Measured case: a "KI in
      # Wertschöpfungsketten" call that only the keyword query ever returned.
      discovery_terms:
        - "Bekanntmachung"
        - "Förderrichtlinie"
        - "Förderaufruf"
      # Per search term: results per page (Brave's max is 20) and how many pages
      # to page through (Brave's offset caps at 9, so at most 10).
      max_results_per_keyword: 20
      search_pages: 3
      crawl_delay: 30 # bmftr.bund.de's robots.txt specifies Crawl-delay: 30

    - name: "BLE (Bundesanstalt für Landwirtschaft und Ernährung)"
      discovery: listing
      # listing_url: the one overview page we fetch and scan for links.
      listing_url: "https://www.ble.de/DE/Projektfoerderung/Bekanntmachungen/Bekanntmachungen_node.html"
      # Of that page's many links (nav menu, "Kontakt", ...), only ones whose
      # URL contains this are real funding-programme pages, e.g.
      # ".../Foerderungen-Auftraege/Bundesprogramm_Umbau_Tierhaltung/.../investiv_node.html".
      link_path_marker: "/Foerderungen-Auftraege/"
      crawl_delay: 5 # ble.de has no robots.txt at all; a small delay anyway out of courtesy

    - name: "BMFSFJ Förderrichtlinien"
      discovery: listing
      listing_url: "https://www.bmbfsfj.bund.de/bmbfsfj/ministerium/ausschreibungen-foerderung/foerderrichtlinien"
      # Picks out links like ".../foerderrichtlinien/demokratie-leben" from the
      # rest of that page's navigation.
      link_path_marker: "/foerderrichtlinien/"
      crawl_delay: 5 # bmbfsfj.bund.de's robots.txt allows everything, no delay specified

    - name: "BMDS (Digitales und Staatsmodernisierung) Bekanntmachungen"
      discovery: listing
      listing_url: "https://bmds.bund.de/service/bekanntmachungen/"
      # Same path the listing itself lives under, which is unusual — the listing
      # page's own "#"/"#top" anchors therefore reduce to the listing URL, and
      # _listing_urls drops it for exactly that reason.
      link_path_marker: "/service/bekanntmachungen/"
      # Mixed content: Förderrichtlinien and Ausschreibungen sit next to
      # Vergabebekanntmachungen (procurement — cleaning contracts, car leasing).
      # Those are left in rather than filtered by title: profile matching scores
      # them near zero anyway, and a title filter would be one more thing to get
      # wrong when the ministry renames a category.
      crawl_delay: 5 # bmds.bund.de's robots.txt disallows only /typo3/ and sets no delay

    - name: "BMV (Verkehr) Förderaufrufe und -richtlinien"
      # Checked 2026-11-02. bmv.de (bmdv.bund.de redirects there) has no announcement
      # listing — DE/Service/Foerderprojekte/ lists 23 programme pages without calls
      # or deadlines, and the sitemap holds only 336 pages. Its site search, though,
      # IS allowed: robots.txt disallows only /_SUMP/ and /_BVMFOR/, no Crawl-delay,
      # and there is no bot-detection. So the search page serves as the listing,
      # once per term, restricted to attachments ("Publication--Anlagen") and
      # sorted newest first. Each result is a wrapper page whose call is a PDF.
      discovery: listing
      listing_url: "https://www.bmv.de/SiteGlobals/Forms/Suche/DE/Expertensuche_Formular.html?templateQueryString={term}&documentType_=Publication--Anlagen&documentType_.GROUP=1&selectSort=commonSortDate_dt+desc&selectSort.GROUP=1"
      listing_terms:
        - "Förderaufruf"
        - "Förderrichtlinie"
        - "Aufruf zur Skizzeneinreichung"
        - "Aufruf zur Antragseinreichung"
        - "Richtlinie über Zuwendungen"
      # Without a leading slash on purpose: each result links its title page
      # relatively ("SharedDocs/DE/Anlage/E/foo.html") and its PDF absolutely
      # ("/SharedDocs/…/foo.pdf?__blob=…", link text "Download"). We want the title
      # page — it names the document — and the include list below drops the
      # "Download" links.
      link_path_marker: "SharedDocs/DE/Anlage/"
      # The attachments these terms find are mostly not calls: factsheets, reviewer
      # matrices, outline templates, English versions, minutes, an organisation
      # chart. Each one followed costs two requests plus an LLM call, so the link
      # text has to name a call or a Richtlinie. Run with -v to see what was left out.
      link_text_include: ["aufruf", "richtlinie", "bekanntmachung"]
      link_text_exclude:
        - "factsheet"
        - "kurzübersicht"
        - "faq"
        - "gutachtermatrix"
        - "gliederungsvorlage"
        - "vorlage"
        - "englisch"
        - "english"
        - "niederschrift"
      # The result is "…/Anlage/E/foo.html", a wrapper with the title and one download
      # link; the text comes from "foo.pdf?__blob=publicationFile". Measured on the
      # PioDAK Förderaufruf: 16.7 kB of clean text, submission window included.
      document_pdf: true
      # No Crawl-delay is set, but the server is slow: 20 s responses and timeouts
      # after 30–45 s were measured, which http.py's retries absorb.
      crawl_delay: 5

    # NOT bundeswirtschaftsministerium.de (BMWE/BMWK): every page on that domain,
    # including the plain homepage, redirects to validate.perfdrive.com — the same
    # Radware Bot Manager challenge foerderdatenbank.de uses. It's not a robots.txt
    # restriction we could work around (like BMFTR's), it's active bot-detection on
    # the whole site, so this can't be a "listing" or "brave" source at all. If you
    # need BMWE calls, that'd have to go through the same manual-export route as
    # foerderdatenbank.de (see manual_import above).
    #
    # Checked 2026-10-29 as a way to get BMWE calls in anyway:
    #  - energieforschung.de (BMWE's energy-research portal) IS crawlable, and
    #    /de/foerderung/foerderangebote/ lists ~9 real Förderaufrufe. But each
    #    detail page carries only ~6 kB of mostly navigation text; the call itself
    #    is a linked PDF, which this connector doesn't read. It would add entries
    #    with no deadline and no funding rate, which is worse than no entries.
    #  - foerderzentrale.gov.de (the new federal funding portal) renders results
    #    server-side and would be an ideal single source for several ministries,
    #    but it held 6 programmes in total and ignored the search query. Worth
    #    re-checking later.
    #
    # NOT bmi.bund.de (BMI): reachable and its robots.txt would allow it
    # (Crawl-delay: 10, only /SiteGlobals/ and /DE/Service/ disallowed), but there
    # is nothing to point a connector at. BMI publishes no announcement listing:
    # its sitemap holds 460 pages with no funding index, and its funding content is
    # press releases and PDFs. The R&D calls BMI co-funds are published as BMFTR
    # Bekanntmachungen ("Forschung für die zivile Sicherheit"), which the BMFTR
    # source above already collects.

foerderinfo_newsletter:
  # The way BMWE and BMI reach this monitor at all. BMWE's own site is behind a
  # Radware bot-manager challenge and BMI publishes no announcement listing, but
  # both appear in the Förderberatung des Bundes newsletter — which is also put on
  # the web, under a path robots.txt allows.
  #
  # Each entry is a teaser, not a Förderrichtlinie: title, submission window,
  # ministry, two sentences. The deadline is exact (it comes from the markup's own
  # ISO datetime), but there is no funding rate in it.
  #
  # NOT used, though both would be easier: the newsletter as e-mail (the web issues
  # hold the same content, so a mailbox buys nothing) and foerderinfo's RSS feeds
  # and HTML announcement lists — those sit under /services/ and /SiteGlobals/,
  # which this site's robots.txt disallows.
  enabled: true
  archive_url: "https://www.foerderinfo.bund.de/foerderinfo/de/news/newsletter/newsletter.html"
  # The archive lists only the last three issues (~6 weeks), so issues already read
  # are remembered here — otherwise an announcement would drop out of the reports as
  # soon as its issue rotated off that page, deadline or not.
  state_path: "state/foerderinfo_newsletter.json"
  crawl_delay: 30 # foerderinfo.bund.de's robots.txt specifies Crawl-delay: 30

  # A teaser links to the announcement itself, and the Bundesanzeiger — where every
  # Förderrichtlinie is officially published — serves it as a PDF at a stable URL.
  # Fetching that turns a two-sentence teaser into the full text: the funding rate
  # the teaser never has, and enough substance for profile matching to judge the
  # call on. Measured: 6–25 kB of clean text per document.
  #
  # An allowlist, not "follow every link": the teasers point at a dozen domains, and
  # a host belongs here only after its robots.txt has been checked. Each PDF is
  # downloaded once and then re-derived from the cached text, exactly like a scraped
  # HTML page.
  full_text_hosts:
    - "www.bundesanzeiger.de" # robots.txt disallows only /nlp and /construction_page.html, no Crawl-delay
    # BMV teasers link their Förderaufruf as a PDF on bmv.de itself (measured: PioDAK,
    # ".../Anlage/E/foerderaufruf-1-piodak.pdf?__blob=publicationFile").
    - "www.bmv.de" # robots.txt disallows only /_SUMP/ and /_BVMFOR/, no Crawl-delay
  full_text_delay: 5 # no Crawl-delay is specified there; spaced out of courtesy

llm:
  # Used to extract the funding rate / deadline from raw scraped text (BMFTR pages,
  # manually imported foerderdatenbank.de pages) more reliably than plain regex can —
  # German funding-call text phrases these in too many different ways for fixed
  # patterns to catch consistently. Falls back to the regex-based extraction for
  # anything it doesn't find, and for anything the backend fails on.
  #
  # Set enabled: false to skip the LLM entirely and use regex-only extraction.
  enabled: true

  # backend and ollama.base_url are deployment-specific: override them in
  # config.local.yaml rather than here. This file is committed to a public
  # repository, so an internal host address does not belong in it, and the
  # default stays on the local backend so profile data isn't sent to a hosted
  # API by accident.
  #
  # Which backend to use — exactly one is called, never both:
  #   "gemini" -> Google's hosted API. Needs an API key, subject to their quotas,
  #               and the scraped page text is sent to Google.
  #   "ollama" -> a local Ollama instance. No API key, no quota, nothing leaves
  #               the machine; speed depends on local hardware.
  backend: "ollama"

  gemini:
    # Setup (~1 min, free): https://aistudio.google.com/apikey -> create an API
    # key -> put it in config.local.yaml (NOT here — this file is committed;
    # config.local.yaml is gitignored and deep-merged on top at load time).
    api_key: ""
    # "gemini-flash-lite-latest" is an alias Google keeps pointed at their current
    # lite flash model. We use the lite variant specifically because the full
    # "gemini-flash-latest" (currently gemini-3.5-flash) only gets 20 free
    # requests/day per project - way too little for this tool's actual volume.
    # The lite tier has a separate, much higher free daily quota.
    model: "gemini-flash-lite-latest"

  ollama:
    base_url: "http://localhost:11434"
    # Must match a model the local instance actually has (see "ollama list").
    model: "qwen3.8:latest"
    # qwen3.8 is a reasoning model; leaving thinking on makes it spend most of its
    # time and tokens on a thinking pass this extraction task doesn't need.
    think: false
    # Seconds. Must exceed the cold start, not just the inference: loading the
    # model into memory was measured at ~380 s on the configured host, so the
    # previous 300 s guaranteed that the first request after a model change timed
    # out. Warm requests take ~3-85 s depending on prompt length.
    timeout: 900

review:
  # So you don't have to work through the whole table again on every run: the
  # Excel's first column, "Review", is yours to write in. Pick "not relevant"
  # (or any value listed under dismissed_values) next to a call you've assessed
  # and don't want to see again — the next run remembers it, matched by the
  # call's link, and leaves the row out entirely while hide_dismissed is on.
  #
  # Any OTHER text you write there ("applied", "asking the department", ...) is
  # kept and shown, so the column doubles as a notes field. An empty Review cell
  # is what "not looked at yet" looks like.
  #
  # These values also become the dropdown offered in that column. Editing this
  # list changes the dropdown — but renaming a value orphans marks already made
  # with the old wording, and those rows come back. To rename cleanly, change the
  # wording in BOTH the Excel's Review column and state_path: the Excel wins on
  # every run, so editing only the JSON gets overwritten right back.
  #
  # Marks are also mirrored into state_path, because the Excel gets overwritten
  # on every run — that file is what makes them survive a deleted or moved
  # spreadsheet. Delete it (and clear the column) to start over.
  enabled: true
  state_path: "state/review.json"
  hide_dismissed: true
  dismissed_values:
    - "not relevant"
    - "done"
    - "no"
    - "x"

profiles:
  # Company profiles (SICP members): the same collected calls are matched against
  # every profile in `directory`, producing one report per company. Only runs when
  # --profiles / --profile is passed; without those flags nothing here is touched.
  #
  # The profile YAMLs hold confidential member data and are gitignored — only
  # profiles/example.yaml is in the repository.
  enabled: true
  directory: "profiles"
  output_dir: "output"

  # Hand-maintained programmes that can't be collected automatically (see the
  # BMWE note under gov_bekanntmachungen). They're treated as ordinary calls.
  static_catalogue: "programmes_static.yaml"

  # How much of a call's text the scoring prompt gets. Measured against qwen3.8
  # on the configured host: ~24 s per evaluation at 20000 characters versus ~85 s
  # at the full ~98000, and one evaluation runs per (call, profile) pair — the
  # full text would make a wide profile take hours. Fit and eligibility rest on
  # the opening sections (Förderziel, Zuwendungsempfänger), which fit in this
  # budget. Raise it if eligibility conditions are being missed on long calls;
  # the deadline and funding rate are unaffected, llm_extract reads those from
  # the whole document.
  max_text_chars: 20000

  # Drop matches the model scored below this. 0 keeps everything the prefilter let
  # through, which is useful while tuning a profile's themes.
  min_score: 0

  # Hard cap on LLM evaluations per profile and run, or null for no cap. Each
  # evaluation is one local inference over the full call text, so a wide profile
  # against ~110 calls is minutes of compute. Candidates are evaluated highest
  # prefilter weight first, so a cap spends the budget on the best candidates.
  max_evaluations_per_profile: null

  # Evaluations are cached per (call link, profile fingerprint, prompt version).
  # Editing a profile's themes invalidates its cached evaluations; editing its
  # contact person does not.
  cache_path: "cache/matches.json"
  cache_max_age_days: 30

  # Per-profile review state. {profile} is replaced with the profile id. Mark
  # entries with: python -m fue_monitoring.main --mark <id> <link> "not relevant"
  review_state_template: "state/review_{profile}.json"

cache:
  # Announcement pages are static documents, but each uncached one costs its
  # site's robots.txt Crawl-delay (30s for bmftr.bund.de) plus an LLM call — so a
  # broad run without this takes about an hour, and nearly all of that is re-doing
  # work. With the cache only genuinely new announcements cost anything.
  # Cached are the page text and the extracted fields, NOT the keyword matches:
  # those are recomputed every run, so editing `keywords` takes effect right away.
  # Delete the file below to force a full refresh.
  enabled: true
  path: "cache/pages.json"
  max_age_days: 30
  # Brave search answers, kept this many hours (0 = off). Brave bills every
  # request, and a re-run after a crash, an abort or a config fix would otherwise
  # pay for the same searches again. Cached per query and result page, so a new
  # search term (e.g. a new profile theme) is still asked. Delete the file to
  # force fresh searches.
  search_path: "cache/brave_searches.json"
  search_max_age_hours: 12

output:
  path: "output/funding_calls.xlsx"
